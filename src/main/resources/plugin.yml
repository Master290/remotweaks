name: RemoTweaks
version: 1.0.0
main: su.remo.tweaks.RemoTweaks
api-version: '1.21'
author: daniar
description: Full-featured Vanilla+ quality of life plugin for SMP servers.

commands:
  sit:
    description: Сесть на землю или текущий блок
    permission: remotweaks.sit
    permission-message: §cУ вас нет прав для использования этой команды!
  trade:
    description: Безопасный обмен предметами с игроком
    permission: remotweaks.trade
    permission-message: §cУ вас нет прав для использования этой команды!
  sort:
    description: Сортировка открытого контейнера или личного инвентаря
    aliases: [invsort, isort]
    permission: remotweaks.sort
    permission-message: §cУ вас нет прав для использования этой команды!
  bottle:
    description: Упаковка опыта в пузырьки опыта
    aliases: [xpbottle]
    permission: remotweaks.bottle
    permission-message: §cУ вас нет прав для использования этой команды!
  stats:
    description: Просмотр игровой статистики и времени в игре
    aliases: [playtime, stat]
    permission: remotweaks.stats
    permission-message: §cУ вас нет прав для использования этой команды!
  remotweaks:
    description: Основная команда управления плагином RemoTweaks
    aliases: [rt]
    permission: remotweaks.admin
    permission-message: §cУ вас нет прав для использования этой команды!
  prefix:
    description: Управление префиксами игроков в чате, табе и над головой
    aliases: [prefixes, setprefix]
  suffix:
    description: Управление суффиксами игроков в чате, табе и над головой
    aliases: [suffixes, setsuffix]
  glow:
    description: Включение цветной подсветки персонажа
    aliases: [glowing]
  msg:
    description: Отправить личное сообщение игроку
    aliases: [tell, w, m]
  r:
    description: Быстрый ответ на последнее личное сообщение
    aliases: [reply]
  socialspy:
    description: Наблюдение за личными сообщениями (для администрации)
    aliases: [spy]
    permission: remotweaks.socialspy
    permission-message: §cУ вас нет прав для использования этой команды!
  hug:
    description: Дружески обнять игрока
  kiss:
    description: Поцеловать игрока
  highfive:
    description: Дать пять игроку
    aliases: [five]
  lock:
    description: Управление замками и приватными сундуками
    aliases: [locks, private]
  roll:
    description: Бросок игрального кубика (кости)
    aliases: [dice]
  coin:
    description: Подбросить монетку (Орел или Решка)
    aliases: [flip, toss]
  mail:
    description: Отправка и чтение писем оффлайн-игрокам
    aliases: [email, letter]
  chunk:
    description: Подсветка границ текущего чанка частицами
    aliases: [chunkborder, chunkborders, cb]
  ruler:
    description: Рулетка и замер расстояния между блоками
    aliases: [measure]
  grave:
    description: Просмотр координат ваших могил
    aliases: [graves]
  board:
    description: Городская доска объявлений сервера
    aliases: [bulletin, notices, doska]
    permission: remotweaks.board
    permission-message: §cУ вас нет прав для использования этой команды!
  poll:
    description: Демократические голосования и опросы игроков
    aliases: [polls, vote, opros]
    permission: remotweaks.poll
    permission-message: §cУ вас нет прав для использования этой команды!

permissions:
  remotweaks.sit:
    description: Позволяет использовать команду /sit и садиться на блоки
    default: true
  remotweaks.ride:
    description: Позволяет садиться на плечи другим игрокам
    default: true
  remotweaks.trade:
    description: Позволяет безопасно обмениваться предметами
    default: true
  remotweaks.harvest:
    description: Позволяет собирать и пересаживать урожай кликом ПКМ
    default: true
  remotweaks.choptree:
    description: Позволяет срубать деревья целиком топором с зажатым Shift
    default: true
  remotweaks.mobpickup:
    description: Позволяет брать жителей и животных на руки (Shift + ПКМ)
    default: true
  remotweaks.showitem:
    description: Позволяет показывать предмет в чате через [item] или [hand]
    default: true
  remotweaks.frames:
    description: Позволяет переключать видимость рамок
    default: true
  remotweaks.armorstand:
    description: Позволяет открывать редактор стоек для брони
    default: true
  remotweaks.armorswap:
    description: Позволяет быстро менять сет брони со стойкой
    default: true
  remotweaks.beehive:
    description: Позволяет осматривать ульи и количество пчёл
    default: true
  remotweaks.colors.anvil:
    description: Позволяет использовать цветовые коды на наковальне
    default: true
  remotweaks.colors.signs:
    description: Позволяет использовать цветовые коды на табличках
    default: true
  remotweaks.sort:
    description: Позволяет использовать авто-сортировку сундуков и инвентаря
    default: true
  remotweaks.potionstack:
    description: Позволяет стакать зелья до 16 штук
    default: true
  remotweaks.shulkeropen:
    description: Позволяет открывать шалкеры из руки и инвентаря
    default: true
  remotweaks.bottle:
    description: Позволяет упаковывать опыт в пузырьки
    default: true
  remotweaks.mention:
    description: Позволяет упоминать игроков в чате со звуком
    default: true
  remotweaks.stats:
    description: Позволяет просматривать игровую статистику
    default: true
  remotweaks.prefix.admin:
    description: Позволяет устанавливать и удалять префиксы и суффиксы игроков
    default: op
  remotweaks.glow:
    description: Позволяет использовать команду /glow для подсветки персонажа
    default: true
  remotweaks.socialspy:
    description: Позволяет просматривать личные сообщения других игроков
    default: op
  remotweaks.lock.admin:
    description: Позволяет открывать и ломать любые заблокированные контейнеры
    default: op
  remotweaks.admin:
    description: Административные команды плагина
    default: op
  remotweaks.itemgift:
    description: Позволяет передавать предметы из рук в руки (Shift + ПКМ)
    default: true
  remotweaks.board:
    description: Позволяет просматривать и размещать объявления на доске
    default: true
  remotweaks.board.admin:
    description: Позволяет модерировать и удалять любые объявления на доске
    default: op
  remotweaks.campfire:
    description: Позволяет получать уют и отдых у костра
    default: true
  remotweaks.poll:
    description: Позволяет участвовать в голосованиях и опросах
    default: true
  remotweaks.poll.create:
    description: Позволяет создавать голосования и опросы
    default: true
  remotweaks.poll.admin:
    description: Позволяет завершать и модерировать любые голосования
    default: op

